<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solar Year Clock</title>
<meta name="theme-color" content="#0b1428">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Cormorant+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one-screen app. Top bar, dial that scales into the free space, metrics, slider pinned to the bottom. */
  :root{
    --bg:#0b1428; --panel:#13213f; --panel2:#0e1a33; --line:#2e4068;
    --gold:#e9c46a; --gold-d:#3a2c0c; --ink:#2a1d05; --text:#f3ead7; --muted:#b9b2a0;
    --serif:"Cormorant Garamond",Georgia,serif; --sc:"Cormorant SC","Cormorant Garamond",Georgia,serif;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --fs-xs:clamp(10.5px,1.45vh,12.5px); --fs-s:clamp(12.5px,1.85vh,16px);
    --fs-m:clamp(14px,2.2vh,19px); --fs-l:clamp(18px,2.8vh,26px);
    --track-h:clamp(42px,6.2vh,64px); --thumb-w:14px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;overflow-x:clip}
  body{font-family:var(--serif);-webkit-tap-highlight-color:transparent;font-variant-numeric:lining-nums}
  button{font:inherit;color:inherit}
  .app{height:100%;display:flex;flex-direction:column;max-width:1080px;margin:0 auto}

  .top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
       padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  .pill{font-family:var(--sc);letter-spacing:.1em;font-size:var(--fs-s);color:var(--gold);background:var(--gold-d);
        border:0;border-radius:11px;padding:6px 12px;cursor:pointer;min-width:0;max-width:100%;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;
         padding:6px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
  .dialWrap{flex:1;min-height:150px;position:relative}
  #clock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
  .badge{position:absolute;top:0;display:flex;align-items:center;gap:8px;pointer-events:none;z-index:1;--ico:clamp(36px,5.6vh,58px)}
  .badge:not(.right){left:0}
  .badge.right{right:0;text-align:right}
  .badge.bottom{top:auto;bottom:0}
  .badge canvas{width:var(--ico);height:var(--ico);flex:none;display:block}
  .badge b{display:block;font-family:var(--ui);font-weight:700;font-size:var(--fs-l);line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .badge span{display:block;font-family:var(--ui);font-size:var(--fs-s);color:var(--muted);white-space:nowrap;margin-top:2px}
  /* always exactly two lines so the badges never change height */
  #moonName,#altCap{white-space:pre;line-height:1.15;height:2.3em}
  .metrics{flex:none;display:flex;flex-direction:column;gap:7px;min-width:0}
  @media (min-width:900px) and (min-height:560px){
    :root{--fs-xs:13px;--fs-s:16px;--fs-m:21px;--fs-l:30px}
    .stage{display:grid;grid-template-columns:minmax(0,1fr) 460px;grid-template-rows:minmax(0,1fr);gap:32px;align-items:center}
    .dialWrap{height:100%}
    .metrics{gap:10px}
    .tile{padding:10px 4px 8px}.tw{padding:10px 12px;row-gap:4px}
  }
  /* Short screens (landscape phones): let the page scroll, keep the controls stuck to the bottom */
  @media (max-height:540px){
    html,body{height:auto;min-height:100%}
    .app{height:auto;min-height:100vh}
    .stage{flex:none}
    .dialWrap{flex:none;height:min(92vw,72vh)}
    .bar{position:sticky;bottom:0;z-index:5}
  }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px}

  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .tile{padding:6px 2px 5px;text-align:center;min-width:0}
  .tile b{display:block;font-size:var(--fs-m);white-space:nowrap;line-height:1.15}
  .tile span{display:block;font-family:var(--ui);font-size:var(--fs-xs);color:var(--muted)}
  .tile small{display:block;font-family:var(--ui);font-size:var(--fs-xs);color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .tw{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));align-items:center;gap:1px 4px;padding:6px 8px}
  .tw .h{text-align:center;font-family:var(--ui);font-size:var(--fs-xs);color:var(--muted);line-height:1.2;white-space:nowrap}
  .tw .h i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0;border:1px solid #fff3}
  .tw .h em{display:block;font-style:normal;opacity:.7}
  .tw .rl{font-family:var(--ui);font-size:var(--fs-xs);color:var(--muted);padding-right:4px}
  .tw button{background:none;border:0;border-radius:8px;padding:3px 0;cursor:default;font-family:var(--serif);font-weight:600;
             font-size:var(--fs-m);white-space:nowrap;font-variant-numeric:tabular-nums}
  .tw button:disabled{color:var(--muted);cursor:default}

  /* pinned bottom control bar */
  .bar{flex:none;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
       box-shadow:0 -10px 28px #0007;
       padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .bar-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
  .r1{display:flex;align-items:center;gap:8px;position:relative}
  .btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--gold);color:var(--ink);flex:none;
       display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 10px #0007}
  .btn svg{width:18px;height:18px}
  .dateBtn{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer}
  #dateLabel{font-size:var(--fs-l);font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dateLabel::after{content:" ▾";font-size:.6em;color:var(--gold);vertical-align:.15em}
  #dateSub{font-size:var(--fs-s);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #datePick{position:absolute;left:110px;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
  .ibtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);flex:none;
        display:grid;place-items:center;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:0}
  .ibtn:active{background:#1d2f57}
  .ibtn svg{width:15px;height:15px}
  .spd{height:42px;min-width:54px;padding:0 10px;border-radius:21px;border:2px solid var(--gold);background:var(--gold-d);
       color:var(--gold);font-family:var(--ui);font-weight:700;font-size:clamp(16px,2.4vh,20px);cursor:pointer;flex:none;
       font-variant-numeric:tabular-nums}
  .spd:active{background:#4a3910}
  .ghost.today{height:28px;padding:2px 10px;flex:none}
  .ghost{border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:11px;flex:none;
         font-family:var(--sc);font-size:var(--fs-s);letter-spacing:.08em;padding:4px 9px;cursor:pointer;height:36px}

  .track{position:relative;width:100%;height:var(--track-h)}
  #heat{position:absolute;inset:0;width:100%;height:100%;display:block}
  #day{-webkit-appearance:none;appearance:none;position:absolute;inset:0;width:100%;height:100%;
       margin:0;background:transparent;cursor:ew-resize;touch-action:pan-y}
  #day::-webkit-slider-runnable-track{height:var(--track-h);background:transparent}
  #day::-moz-range-track{height:var(--track-h);background:transparent}
  #day::-webkit-slider-thumb{-webkit-appearance:none;width:var(--thumb-w);height:var(--track-h);border-radius:7px;
       background:rgba(233,196,106,.18);border:2px solid var(--gold);box-shadow:0 0 0 1px #000c,0 2px 10px #000a}
  #day::-moz-range-thumb{width:10px;height:calc(var(--track-h) - 4px);border-radius:7px;background:rgba(233,196,106,.18);
       border:2px solid var(--gold);box-shadow:0 0 0 1px #000c}
  #day:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:12px}
  .months{position:relative;height:14px;font-family:var(--ui);font-size:var(--fs-xs);color:var(--muted)}
  .months span{position:absolute;transform:translateX(-50%);top:0;white-space:nowrap}
  @media (max-width:520px){.months span{font-size:0}.months span::after{content:attr(data-s);font-size:var(--fs-xs)}}
  .r4{display:flex;align-items:center;gap:4px}
  .markers{display:flex;gap:4px;flex:1;min-width:0}
  .chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 8px;
        font-family:var(--ui);font-size:var(--fs-xs);color:var(--text);cursor:pointer;white-space:nowrap}
  .chip.on{border-color:var(--gold);color:var(--gold)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  dialog{width:min(480px,calc(100vw - 32px));max-height:min(640px,calc(100vh - 48px));border:1px solid var(--line);border-radius:20px;
         background:var(--panel);color:var(--text);padding:16px}
  dialog::backdrop{background:#000a}
  .dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .dhead h2{margin:0;font-size:24px}
  .search{width:100%;font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
          background:var(--panel2);color:var(--text);outline:none}
  .search:focus{border-color:var(--gold)}
  .gps{width:100%;margin:10px 0;border:1px solid var(--gold);background:var(--gold-d);color:var(--gold);border-radius:12px;
       padding:9px;cursor:pointer;font-family:var(--sc);letter-spacing:.08em;font-size:16px}
  .results{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
  .results li{padding:9px 10px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:18px}
  .results li:hover,.results li:focus{background:#ffffff0d;outline:none}
  .results small{color:var(--muted);font-family:var(--ui);font-size:12px;white-space:nowrap;align-self:center}
  .status{font-family:var(--ui);font-size:12px;color:var(--muted);min-height:16px;margin-top:6px}
  .manual{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:8px}
  .manual input{min-width:0;font:inherit;font-size:16px;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
  summary{font-family:var(--ui);font-size:12px;color:var(--muted);cursor:pointer;margin-top:6px}
  .toast{position:fixed;left:50%;top:56px;transform:translateX(-50%) translateY(-10px);opacity:0;transition:.25s;
         background:#000d;color:var(--text);padding:8px 14px;border-radius:12px;font-family:var(--ui);font-size:13px;pointer-events:none;max-width:calc(100vw - 32px)}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="pill" id="locBtn" title="Change location">📍 Destin, Florida</button>
  </div>

  <main class="stage">
    <div class="dialWrap" id="dialWrap">
      <div class="badge" id="sunB" title="Earth–Sun closeness: 100% at the closest point of the orbit (147.1M km); lower as Earth moves farther away">
        <canvas id="sunIco" aria-hidden="true"></canvas>
        <div><b id="sunPct">–</b><span id="sunCap"></span></div>
      </div>
      <div class="badge right" id="moonB" title="Moon phase and illumination">
        <div><b id="moonPct">–</b><span id="moonName"></span></div>
        <canvas id="moonIco" aria-hidden="true"></canvas>
      </div>
      <div class="badge bottom" id="altB" title="How high the sun climbs at solar noon: 0° is the horizon, 90° is straight overhead">
        <canvas id="altIco" aria-hidden="true"></canvas>
        <div><b id="altDeg">–</b><span id="altCap"></span></div>
      </div>
      <div class="badge right bottom" id="moonD" title="Moon distance as a share of its maximum distance (406,700 km = 100%). The icon shows its apparent size: smaller when farther.">
        <div><b id="moonClose">–</b><span id="moonKm"></span></div>
        <canvas id="moonDIco" aria-hidden="true"></canvas>
      </div>
      <canvas id="clock" role="img" aria-label="24-hour solar clock for the selected day"></canvas>
    </div>
    <div class="metrics">
      <div class="tiles">
        <div class="card tile"><b id="sRise">–</b><span>Sunrise</span></div>
        <div class="card tile"><b id="sSet">–</b><span>Sunset</span></div>
        <div class="card tile"><b id="sLen">–</b><small id="sDelta"></small><span>Daylight</span></div>
        <div class="card tile"><b id="sNoon">–</b><small id="sPeak"></small><span>Solar noon</span></div>
      </div>
      <div class="card tw" id="tw" aria-label="Times the sun crosses each twilight altitude"></div>
    </div>
  </main>

  <section class="bar" aria-label="Date controls">
    <div class="bar-in">
      <div class="r1">
        <button class="btn" id="play" aria-label="Play through the year"></button>
        <button class="spd" id="speed" aria-label="Playback speed">2×</button>
        <button class="dateBtn" id="dateBtn" aria-label="Pick a date"><div id="dateLabel">–</div><div id="dateSub"></div></button>
        <input type="date" id="datePick" tabindex="-1" aria-hidden="true">
        <button class="ibtn" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="ibtn" id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="track">
        <canvas id="heat" aria-hidden="true"></canvas>
        <input type="range" id="day" min="0" step="1" aria-label="Day of year">
      </div>
      <div class="months" id="months"></div>
      <div class="r4">
        <div class="markers" id="markers"></div>
        <button class="ghost today" id="todayBtn">Today</button>
      </div>
    </div>
  </section>
</div>

<dialog id="locDlg">
  <div class="dhead"><h2>Location</h2><button class="ibtn" id="dlgClose" aria-label="Close">✕</button></div>
  <input class="search" id="q" placeholder="Search a city…" autocomplete="off" enterkeyhint="search">
  <button class="gps" id="gpsBtn">📍 Use my current location</button>
  <ul class="results" id="results"></ul>
  <div class="status" id="dlgStatus"></div>
  <details><summary>Enter coordinates</summary>
    <div class="manual">
      <input id="mLat" inputmode="decimal" placeholder="Latitude">
      <input id="mLon" inputmode="decimal" placeholder="Longitude">
      <button class="ghost" id="mGo">Go</button>
    </div>
  </details>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const RAD = Math.PI / 180, DEG = 180 / Math.PI, STEP = 4, SEG = 1440 / STEP;
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('solarclock.' + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem('solarclock.' + k, JSON.stringify(v)); } catch {} },
  };

  const DEFAULT_LOC = { name: 'Destin, Florida', lat: 30.3935, lon: -86.4958, tz: 'America/Chicago' };
  const PRESETS = [
    DEFAULT_LOC,
    { name: 'New York, NY', lat: 40.7128, lon: -74.006, tz: 'America/New_York' },
    { name: 'Los Angeles, CA', lat: 34.0522, lon: -118.2437, tz: 'America/Los_Angeles' },
    { name: 'Anchorage, AK', lat: 61.2181, lon: -149.9003, tz: 'America/Anchorage' },
    { name: 'Honolulu, HI', lat: 21.3069, lon: -157.8583, tz: 'Pacific/Honolulu' },
    { name: 'London, UK', lat: 51.5074, lon: -0.1278, tz: 'Europe/London' },
    { name: 'Reykjavík, Iceland', lat: 64.1466, lon: -21.9426, tz: 'Atlantic/Reykjavik' },
    { name: 'Tromsø, Norway', lat: 69.6492, lon: 18.9553, tz: 'Europe/Oslo' },
    { name: 'Quito, Ecuador', lat: -0.1807, lon: -78.4678, tz: 'America/Guayaquil' },
    { name: 'Sydney, Australia', lat: -33.8688, lon: 151.2093, tz: 'Australia/Sydney' },
    { name: 'Tokyo, Japan', lat: 35.6762, lon: 139.6503, tz: 'Asia/Tokyo' },
    { name: 'Cape Town, South Africa', lat: -33.9249, lon: 18.4241, tz: 'Africa/Johannesburg' },
  ];

  // Altitude bands (degrees), highest first
  const TH = [6, -0.833, -4, -6, -12, -18];
  const BANDS = [
    ['Daytime', '#6f9fbd'],
    ['Golden Hour', '#dca244'],
    ['Civil Twilight', '#c8563f'],
    ['Blue Hour', '#985a9c'],
    ['Nautical Twilight', '#4c66bf'],
    ['Astronomical Twilight', '#18234a'],
    ['Nighttime', '#05080f'],
  ];
  const BAND_RGB = BANDS.map(b => [1, 3, 5].map(i => parseInt(b[1].substr(i, 2), 16)));
  const TH_MID = [6, -0.833];
  const MID_C = ['#6f9fbd', '#dca244', '#05080f'];
  // Twilight grid columns: the altitude the sun crosses, and the band colour it marks
  const TW_COLS = [
    { t: -18, name: 'Astro', deg: '−18°', c: BANDS[5][1] },
    { t: -12, name: 'Nautical', deg: '−12°', c: BANDS[4][1] },
    { t: -6, name: 'Civil', deg: '−6°', c: BANDS[2][1] },
    { t: 6, name: 'Golden', deg: '+6°', c: BANDS[1][1] },
  ];

  // ---------- astronomy (NOAA solar calculator algorithm) ----------
  function sunPos(ms, lat, lon) {
    const jc = (ms / 864e5 + 2440587.5 - 2451545) / 36525;
    const L0 = ((280.46646 + jc * (36000.76983 + jc * 0.0003032)) % 360) * RAD;
    const M = (357.52911 + jc * (35999.05029 - 0.0001537 * jc)) * RAD;
    const e = 0.016708634 - jc * (0.000042037 + 0.0000001267 * jc);
    const C = Math.sin(M) * (1.914602 - jc * (0.004817 + 0.000014 * jc))
            + Math.sin(2 * M) * (0.019993 - 0.000101 * jc) + Math.sin(3 * M) * 0.000289;
    const om = (125.04 - 1934.136 * jc) * RAD;
    const lam = (L0 * DEG + C - 0.00569 - 0.00478 * Math.sin(om)) * RAD;
    const eps0 = 23 + (26 + (21.448 - jc * (46.815 + jc * (0.00059 - jc * 0.001813))) / 60) / 60;
    const eps = (eps0 + 0.00256 * Math.cos(om)) * RAD;
    const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
    const y = Math.tan(eps / 2) ** 2;
    const eot = 4 * DEG * (y * Math.sin(2 * L0) - 2 * e * Math.sin(M) + 4 * e * y * Math.sin(M) * Math.cos(2 * L0)
              - 0.5 * y * y * Math.sin(4 * L0) - 1.25 * e * e * Math.sin(2 * M));
    const utcMin = (((ms % 864e5) + 864e5) % 864e5) / 6e4;
    const ha = ((utcMin + eot + 4 * lon) / 4 - 180) * RAD;
    const la = lat * RAD;
    const sinAlt = Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha);
    return { alt: Math.asin(Math.max(-1, Math.min(1, sinAlt))) * DEG, ha, dec, la };
  }
  const sunAlt = (ms, lat, lon) => sunPos(ms, lat, lon).alt;
  // Earth–Sun distance in AU (NOAA radius vector). Apparent size ∝ 1 / distance.
  const AU_KM = 149597870.7, R_PERI = 0.98329, R_APH = 1.01671;
  function sunDistanceAU(ms) {
    const jc = (ms / 864e5 + 2440587.5 - 2451545) / 36525;
    const M = (357.52911 + jc * (35999.05029 - 0.0001537 * jc)) * RAD;
    const e = 0.016708634 - jc * (0.000042037 + 0.0000001267 * jc);
    const C = (Math.sin(M) * (1.914602 - jc * (0.004817 + 0.000014 * jc))
            + Math.sin(2 * M) * (0.019993 - 0.000101 * jc) + Math.sin(3 * M) * 0.000289) * RAD;
    return 1.000001018 * (1 - e * e) / (1 + e * Math.cos(M + C));
  }
  function azimuth(p) {
    const az = Math.atan2(Math.sin(p.ha), Math.cos(p.ha) * Math.sin(p.la) - Math.tan(p.dec) * Math.cos(p.la)) * DEG + 180;
    return (az + 360) % 360;
  }
  const compass = az => ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(az / 22.5) % 16];

  // Moon phase (low-precision lunar theory, good to a fraction of a degree): elongation from the sun → illumination
  const MOON_NAMES = ['New moon', 'Waxing crescent', 'First quarter', 'Waxing gibbous', 'Full moon', 'Waning gibbous', 'Last quarter', 'Waning crescent'];

    c.beginPath(); c.arc(sx, sy, 3.6 * u, 0, Math.PI * 2);
    c.fillStyle = alt >= 0 ? '#ffd24d' : '#8a7a3f';
    if (alt >= 0) { c.shadowColor = '#ffd24d'; c.shadowBlur = 5 * u; }
    c.fill(); c.shadowBlur = 0;
    // observer
    c.beginPath(); c.arc(ox, oy, 1.6 * u, 0, Math.PI * 2); c.fillStyle = '#d9dbe4'; c.fill();
  }

  const xOf = d => INSET + d / (N - 1) * (HW - 2 * INSET);
  function drawHeat() {
    if (!HW || !heatImg) return;
    hx.setTransform(dpr, 0, 0, dpr, 0, 0);
    hx.clearRect(0, 0, HW, HH);
    hx.save();
    hx.beginPath();
    if (hx.roundRect) hx.roundRect(0, 0, HW, HH, 10); else hx.rect(0, 0, HW, HH);
    hx.clip();
    hx.fillStyle = '#05080f'; hx.fillRect(0, 0, HW, HH);
    const colW = (HW - 2 * INSET) / (N - 1);
    hx.imageSmoothingEnabled = true; hx.imageSmoothingQuality = 'high';
    hx.drawImage(heatImg, INSET - colW / 2, 0, HW - 2 * INSET + colW, HH);
    hx.strokeStyle = 'rgba(255,255,255,.12)'; hx.lineWidth = 1;
    for (let m = 1; m < 12; m++) {
      const x = Math.round(xOf(doyOf(YEAR, m, 1) - 0.5)) + .5;
      hx.beginPath(); hx.moveTo(x, 0); hx.lineTo(x, HH); hx.stroke();
    }
    const ln = localNow();
    if (ln.y === YEAR) {
      const tx = xOf(ln.doy);
      hx.fillStyle = '#fff';
      hx.beginPath(); hx.moveTo(tx - 5, 0); hx.lineTo(tx + 5, 0); hx.lineTo(tx, 6); hx.closePath(); hx.fill();
      hx.beginPath(); hx.moveTo(tx - 5, HH); hx.lineTo(tx + 5, HH); hx.lineTo(tx, HH - 6); hx.closePath(); hx.fill();
    }
    hx.restore();
  }

  function buildMonths() {
    const el = $('months'); el.innerHTML = '';
    ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].forEach((n, m) => {
      const mid = (doyOf(YEAR, m, 1) + doyOf(YEAR, m + 1, 1) - 1) / 2;
      const s = document.createElement('span');
      s.textContent = n; s.dataset.s = n[0];
      s.style.left = `calc(${INSET}px + ${mid / (N - 1)} * (100% - ${THUMB}px))`;
      el.appendChild(s);
    });
  }

  // Equinoxes & solstices (Meeus, accurate to minutes for 1900-2100)
  function seasons(y) {
    const Y = (y - 2000) / 1000;
    const jde = [
      2451623.80984 + 365242.37404 * Y + 0.05169 * Y * Y - 0.00411 * Y ** 3 - 0.00057 * Y ** 4,
      2451716.56767 + 365241.62603 * Y + 0.00325 * Y * Y + 0.00888 * Y ** 3 - 0.00030 * Y ** 4,
      2451810.21715 + 365242.01767 * Y - 0.11575 * Y * Y + 0.00337 * Y ** 3 + 0.00078 * Y ** 4,
      2451900.05952 + 365242.74049 * Y - 0.06223 * Y * Y - 0.00823 * Y ** 3 + 0.00032 * Y ** 4,
    ];
    const names = loc.lat >= 0
      ? ['Spring equinox', 'Summer solstice', 'Fall equinox', 'Winter solstice']
      : ['Fall equinox', 'Winter solstice', 'Spring equinox', 'Summer solstice'];
    return jde.map((j, i) => {
      const ms = (j - 2440587.5) * 864e5, l = new Date(ms + tzOffsetMin(ms, loc.tz) * 6e4);
      return { name: names[i], doy: doyOf(l.getUTCFullYear(), l.getUTCMonth(), l.getUTCDate()) };
    });
  }
  const SEASON_ICON = { Spring: '◐', Fall: '◑', Summer: '☀', Winter: '❄' };
  function buildMarkers() {
    const el = $('markers'); el.innerHTML = '';
    for (const s of seasons(YEAR)) {
      const b = document.createElement('button');
      b.className = 'chip'; b.dataset.d = s.doy; b.title = s.name;
      b.textContent = `${SEASON_ICON[s.name.split(' ')[0]]} ${shortDateFmt.format(new Date(Date.UTC(YEAR, 0, 1 + s.doy)))}`;
      b.setAttribute('aria-label', s.name);
      b.onclick = () => goToDay(s.doy);
      el.appendChild(b);
    }
  }

  // ---------- twilight grid ----------
  const tw = $('tw'), twCells = [];
  (function buildTw() {
    tw.appendChild(document.createElement('span'));
    for (const c of TW_COLS) {
      const h = document.createElement('div'); h.className = 'h';
      h.innerHTML = `<i style="background:${c.c}"></i>${c.name}<em>${c.deg}</em>`;
      tw.appendChild(h);
    }
    for (const [ri, label] of [[0, 'Morning'], [1, 'Evening']]) {
      const rl = document.createElement('div'); rl.className = 'rl'; rl.textContent = label; tw.appendChild(rl);
      TW_COLS.forEach((c, ci) => {
        const b = document.createElement('button');
        b.title = `${ri ? 'Evening' : 'Morning'}: sun crosses ${c.deg}`;
        tw.appendChild(b); twCells.push([b, ri, ci]);
      });
    }
  })();
  function renderTw(D) {
    const hm = hand();
    for (const [b, ri, ci] of twCells) {
      const c = D.tw[ci], m = ri ? c.set : c.rise;
      b.disabled = m === null;
      b.dataset.m = m === null ? '' : m;
      b.textContent = m === null ? '—' : fmtShort(m);
    }
  }

  // ---------- render ----------
  let currentData = null;
  function render() {
    if (!S) return;
    const D = currentData = dayData(YEAR, day);
    drawClock(D);
    drawHeat();
    const hm = hand();
    const ph = phaseAt(D.outer, hm);
    cv.setAttribute('aria-label', `24-hour solar clock for ${dateFmt.format(new Date(Date.UTC(YEAR, 0, 1 + day)))}: sunrise ${D.rise !== null ? fmtT(D.rise) : 'none'}, sunset ${D.set !== null ? fmtT(D.set) : 'none'}.`);

    $('sRise').textContent = D.rise !== null ? fmtT(D.rise) : '—';
    $('sSet').textContent = D.set !== null ? fmtT(D.set) : '—';
    $('sLen').textContent = fmtD(D.len);
    const delta = D.len - todayLen;
    const sd = $('sDelta');
    sd.textContent = Math.abs(delta) < 0.5 ? '= today' : `${delta > 0 ? '▲' : '▼'} ${fmtD(delta)}`;
    sd.title = Math.abs(delta) < 0.5 ? 'Same daylight as today' : `${fmtD(delta)} ${delta > 0 ? 'more' : 'less'} daylight than today`;
    $('sNoon').textContent = fmtT(D.noon.m);
    $('sPeak').textContent = `${D.noon.alt.toFixed(1)}° high`;

    const dt = new Date(Date.UTC(YEAR, 0, 1 + day));
    const ln = localNow(), isToday = ln.y === YEAR && ln.doy === day;
    $('dateLabel').textContent = dateFmt.format(dt);
    $('dateSub').textContent = `${wdFmt.format(dt)} · ${YEAR} · Day ${day + 1}${isToday ? ' · Today' : ''}`;
    slider.setAttribute('aria-valuetext', `${dateFmt.format(dt)}, ${YEAR}`);
    document.querySelectorAll('#markers .chip').forEach(c => c.classList.toggle('on', +c.dataset.d === day));


    const rAU = sunDistanceAU(utcAt(YEAR, day, 720));
    $('sunPct').textContent = `${(R_PERI / rAU * 100).toFixed(1)}%`;   // 100% at closest approach (perihelion)
    $('sunCap').textContent = `${(rAU * AU_KM / 1e6).toFixed(1)}M km`;
    drawSunIcon(rAU);
    const mo = moonInfo(utcAt(YEAR, day, hm));
    $('moonPct').textContent = `${Math.round(mo.k * 100)}%`;
    $('moonName').textContent = mo.name.replace(' ', '\n');
    drawMoonIcon(mo);
    $('altDeg').textContent = `${D.noon.alt.toFixed(1)}°`;
    $('altCap').textContent = D.noon.alt >= 0 ? `noon high\n${fmtT(D.noon.m)}` : 'below horizon\nall day';
    drawAltIcon(D.noon.alt);
    const mkm = moonDistanceKm(utcAt(YEAR, day, hm));
    const close = Math.max(0, Math.min(1, (MOON_FAR - mkm) / (MOON_FAR - MOON_NEAR)));   // icon size only
    $('moonClose').textContent = `${(mkm / MOON_FAR * 100).toFixed(1)}%`;               // share of max distance
    $('moonKm').textContent = `${Math.round(mkm).toLocaleString('en-US')} km`;
    drawMoonCloseIcon(close);

    renderTw(D);
    saveState();
  }
  let queued = false;
  const schedule = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(); }); } };

  let saveT = 0, lastHash = location.hash.slice(1);
  function saveState() {
    if (embedded) return;
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      const q = new URLSearchParams({ y: YEAR, d: day + 1 });
      q.set('lat', loc.lat.toFixed(4)); q.set('lon', loc.lon.toFixed(4)); q.set('tz', loc.tz); q.set('n', loc.name);
      lastHash = q.toString();
      try { history.replaceState(null, '', '#' + lastHash); } catch {}
    }, 300);
  }

  // ---------- helpers ----------
  // Jump straight to a whole day: one snapshot per day, never in-between
  function goToDay(target) {
    setPlaying(false);
    day = Math.max(0, Math.min(N - 1, Math.round(target)));
    slider.value = day;
    schedule();
  }
  function setDate(y, d) {
    setPlaying(false);
    if (y !== YEAR) { YEAR = y; day = d; buildYear(); schedule(); }
    else goToDay(d);
  }
  const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch {} };
  let toastT = 0;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- playback ----------
  const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></svg>';
  let lastT = 0, playRaf = 0, playPos = 0;
  function setPlaying(p) {
    playing = p;
    $('play').innerHTML = p ? ICON_PAUSE : ICON_PLAY;
    $('play').setAttribute('aria-label', p ? 'Pause' : 'Play through the year');
    cancelAnimationFrame(playRaf);
    if (p) { playPos = day; lastT = performance.now(); playRaf = requestAnimationFrame(tick); }
  }
  function tick(t) {
    if (!playing) return;
    const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
    // Advance a hidden counter; redraw only when it reaches a new whole day.
    playPos += dt * N / SPEEDS[speedIdx][1];
    if (playPos >= N) playPos -= N;
    const d = Math.min(N - 1, Math.floor(playPos));
    if (d !== day) { day = d; slider.value = d; render(); }
    playRaf = requestAnimationFrame(tick);
  }

  // ---------- controls ----------
  let lastMonth = -1;
  slider.addEventListener('input', () => {
    if (playing) setPlaying(false);
    const d = Math.round(+slider.value);
    if (d === day) return;
    day = d;
    const m = new Date(Date.UTC(YEAR, 0, 1 + day)).getUTCMonth();
    if (lastMonth !== -1 && m !== lastMonth) buzz(6);
    lastMonth = m;
    schedule();
  });
  slider.addEventListener('keydown', e => {
    const k = { ArrowLeft: -1, ArrowRight: 1, ArrowDown: -1, ArrowUp: 1, PageDown: -30, PageUp: 30 }[e.key];
    if (k !== undefined) { e.preventDefault(); e.stopPropagation(); nudgeDay(k * (e.shiftKey ? 7 : 1)); }
    else if (e.key === 'Home') { e.preventDefault(); goToDay(0); }
    else if (e.key === 'End') { e.preventDefault(); goToDay(N - 1); }
  });

  function nudgeDay(n) {
    setPlaying(false);
    let target = day + n;
    if (target >= 0 && target <= N - 1) return goToDay(target);
    if (target < 0) { YEAR--; day = 0; buildYear(); target += N; }
    else { target -= N; YEAR++; day = 0; buildYear(); }
    day = target; slider.value = target; schedule();
  }
  function holdRepeat(btn, fn) {
    let t1 = 0, t2 = 0;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    btn.addEventListener('pointerdown', e => {
      if (e.button) return;
      e.preventDefault(); fn();
      t1 = setTimeout(() => { t2 = setInterval(fn, 70); }, 380);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
    btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); fn(); } });
  }
  holdRepeat($('prevDay'), () => nudgeDay(-1));
  holdRepeat($('nextDay'), () => nudgeDay(1));

  // Tap the date to open the native date picker (any day, any year)
  const picker = $('datePick');
  $('dateBtn').onclick = () => {
    setPlaying(false);
    const dt = new Date(Date.UTC(YEAR, 0, 1 + day));
    picker.value = dt.toISOString().slice(0, 10);
    try { if (picker.showPicker) { picker.showPicker(); return; } } catch {}
    picker.focus(); picker.click();
  };
  picker.addEventListener('change', () => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(picker.value);
    if (!m) return;
    const y = +m[1]; if (y < 1900 || y > 2100) { toast('Pick a year between 1900 and 2100'); return; }
    setDate(y, doyOf(y, +m[2] - 1, +m[3]));
  });

  $('play').onclick = () => setPlaying(!playing);
  const setSpeedLbl = () => {
    $('speed').textContent = SPEEDS[speedIdx][0];
    $('speed').title = `Playback speed: a year in ${SPEEDS[speedIdx][1]} s. Tap to change.`;
    $('speed').setAttribute('aria-label', `Playback speed ${SPEEDS[speedIdx][0]}, tap to change`);
  };
  $('speed').onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; store.set('speed2', speedIdx); setSpeedLbl(); };

  function goToday() {
    const ln = localNow();
    setDate(ln.y, ln.doy);
  }
  $('todayBtn').onclick = goToday;


  // keyboard: Space play, ←/→ day (Shift = week), T today, L location
  document.addEventListener('keydown', e => {
    if (dlg.open || e.metaKey || e.ctrlKey || e.altKey) return;
    const tgt = e.target, k = e.key;
    if (tgt.closest && tgt.closest('input:not([type=range]),textarea')) return;
    if ((k === ' ' || k === 'Enter') && tgt.closest && tgt.closest('button')) return;
    if (k === ' ') { e.preventDefault(); setPlaying(!playing); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') {
      e.preventDefault(); nudgeDay((k === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 7 : 1));
    }
    else if (k === 't' || k === 'T') goToday();
    else if (k === 'l' || k === 'L') { e.preventDefault(); openLoc(); }
  });

  // ---------- location dialog ----------
  const dlg = $('locDlg'), results = $('results'), status = $('dlgStatus');
  function showResults(list) {
    results.innerHTML = '';
    for (const r of list) {
      const li = document.createElement('li'); li.tabIndex = 0;
      li.innerHTML = '<span></span><small></small>';
      li.children[0].textContent = r.name;
      li.children[1].textContent = `${r.lat.toFixed(2)}, ${r.lon.toFixed(2)}`;
      li.onclick = () => setLocation(r);
      li.onkeydown = e => { if (e.key === 'Enter') setLocation(r); };
      results.appendChild(li);
    }
  }
  function openLoc() {
    setPlaying(false);
    $('q').value = ''; status.textContent = ''; showResults(PRESETS);
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    setTimeout(() => $('q').focus(), 50);
  }
  const closeLoc = () => { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); };
  $('locBtn').onclick = openLoc;
  $('dlgClose').onclick = closeLoc;
  dlg.addEventListener('click', e => { if (e.target === dlg) closeLoc(); });

  let searchT = 0, searchSeq = 0;
  $('q').addEventListener('input', () => {
    clearTimeout(searchT);
    const q = $('q').value.trim();
    const local = PRESETS.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
    showResults(q ? local : PRESETS);
    if (q.length < 2) { status.textContent = ''; return; }
    status.textContent = 'Searching…';
    searchT = setTimeout(async () => {
      const seq = ++searchSeq;
      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=10&language=en&format=json`);
        const j = await res.json();
        if (seq !== searchSeq) return;
        const list = (j.results || []).filter(r => r.timezone && validTz(r.timezone)).map(r => ({
          name: [r.name, r.admin1 && r.admin1 !== r.name ? r.admin1 : null, r.country_code === 'US' ? null : r.country].filter(Boolean).join(', '),
          lat: r.latitude, lon: r.longitude, tz: r.timezone }));
        showResults(list.length ? list : local);
        status.textContent = list.length ? '' : 'No matches';
      } catch {
        if (seq === searchSeq) status.textContent = 'City search isn\'t available here. Pick a listed city or enter coordinates.';
      }
    }, 280);
  });
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter' && results.firstChild) results.firstChild.click(); });

  $('gpsBtn').onclick = () => {
    if (!navigator.geolocation) { status.textContent = 'Location is not available in this browser'; return; }
    status.textContent = 'Locating…';
    navigator.geolocation.getCurrentPosition(pos => {
      setLocation({ name: 'My location', lat: pos.coords.latitude, lon: pos.coords.longitude,
                    tz: Intl.DateTimeFormat().resolvedOptions().timeZone });
    }, err => { status.textContent = err.code === 1 ? 'Location is blocked here. Pick a city or enter coordinates.' : 'Could not get your location'; },
    { timeout: 12000, maximumAge: 600000 });
  };
  $('mGo').onclick = () => {
    const lat = parseFloat($('mLat').value), lon = parseFloat($('mLon').value);
    if (!(Math.abs(lat) <= 90 && Math.abs(lon) <= 180)) { status.textContent = 'Enter a latitude between −90 and 90 and a longitude between −180 and 180'; return; }
    setLocation({ name: `${lat.toFixed(3)}, ${lon.toFixed(3)}`, lat, lon, tz: Intl.DateTimeFormat().resolvedOptions().timeZone });
  };

  function setLocation(l) {
    loc = { name: l.name, lat: l.lat, lon: l.lon, tz: l.tz };
    store.set('loc', loc);
    $('locBtn').textContent = `📍 ${loc.name}`;
    closeLoc();
    nowMin = localNow().minute;
    buildYear(); schedule();
    toast(`${loc.name} · ${loc.tz.replace(/_/g, ' ')}`);
  }

  // ---------- init ----------
  if (!embedded) window.addEventListener('hashchange', () => { if (location.hash.slice(1) !== lastHash) location.reload(); });
  $('locBtn').textContent = `📍 ${loc.name}`;
  setSpeedLbl();
  buildYear();
  setPlaying(false);
  if (window.ResizeObserver) { new ResizeObserver(resize).observe(wrapEl); new ResizeObserver(resize).observe(hc); }
  window.addEventListener('resize', resize);
  resize();
  setInterval(() => { if (!playing) schedule(); }, 60000);   // roll over to a new 'today' at midnight
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) setPlaying(false); else { nowMin = localNow().minute; schedule(); }
  });
})();
</script>
</body>
</html>
